// IMAGE DATABASE — IndexedDB stores all images separately
// Images are BIG. localStorage has only 5MB total.
// IndexedDB has 50MB–1GB+ — perfect for images.
// Text data stays in localStorage (fast, simple).
// ════════════════════════════════════════════════════════════════
const ImgDB = (() => {
  const DB_NAME = 'MistakeVaultImages';
  const DB_VER = 1;
  const STORE = 'images';
  let _db = null;
  function open() {
    if (_db) return Promise.resolve(_db);
    return new Promise((res, rej) => {
      const req = indexedDB.open(DB_NAME, DB_VER);
      req.onupgradeneeded = e => e.target.result.createObjectStore(STORE);
      req.onsuccess = e => {
        _db = e.target.result;
        res(_db);
      };
      req.onerror = e => rej(e.target.error);
    });
  }
  async function save(key, dataUrl) {
    if (!key || !dataUrl) return;
    const db = await open();
    return new Promise((res, rej) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put(dataUrl, key);
      tx.oncomplete = () => res(true);
      tx.onerror = e => rej(e.target.error);
    });
  }
  async function load(key) {
    if (!key) return null;
    const db = await open();
    return new Promise((res, rej) => {
      const tx = db.transaction(STORE, 'readonly');
      const req = tx.objectStore(STORE).get(key);
      req.onsuccess = e => res(e.target.result || null);
      req.onerror = e => rej(e.target.error);
    });
  }
  async function remove(key) {
    if (!key) return;
    const db = await open();
    return new Promise((res, rej) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).delete(key);
      tx.oncomplete = () => res(true);
      tx.onerror = e => rej(e.target.error);
    });
  }
  return {
    save,
    load,
    remove
  };
})();

// ════════════════════════════════════════════════════════════════
// localStorage hook — only for text/metadata (never images)
// ════════════════════════════════════════════════════════════════
function useLocalStorage(key, init) {
  const [val, setVal] = useState(() => {
    try {
      const s = localStorage.getItem(key);
      return s ? JSON.parse(s) : init;
    } catch {
      return init;
    }
  });
  useEffect(() => {
    try {
      localStorage.setItem(key, JSON.stringify(val));
    } catch (e) {
      console.warn('localStorage save failed:', e);
    }
  }, [key, val]);
  return [val, setVal];
}

// ════════════════════════════════════════════════════════════════
// useImage hook — loads an image from IndexedDB by key
// ════════════════════════════════════════════════════════════════
function useImage(key) {
  const [url, setUrl] = useState(null);
  useEffect(() => {
    if (!key) {
      setUrl(null);
      return;
    }
    ImgDB.load(key).then(u => setUrl(u || null)).catch(() => setUrl(null));
  }, [key]);
  return url;
}

// MIGRATION — move old base64 images OUT of localStorage INTO IndexedDB

// ════════════════════════════════════════════════════════════════
async function migrateOldData() {
  try {
    const OLD_KEYS = ['mt_questions', 'mt_questions_v2', 'mv_mistakes_v1', 'mv_mistakes_v2', 'mv_mistakes_v3'];
    const OLD_SUB_KEYS = ['mt_subjects', 'mt_subjects_v2', 'mv_subjects_v2', 'mv_subjects_v3'];
    const NEW_M = 'mv_mistakes_v4';
    const NEW_S = 'mv_subjects_v4';
    const NEW_P = 'mv_pyqs_v4';

    // Migrate subjects
    if (!localStorage.getItem(NEW_S)) {
      for (const k of OLD_SUB_KEYS) {
        const raw = localStorage.getItem(k);
        if (raw) {
          localStorage.setItem(NEW_S, raw);
          break;
        }
      }
    }

    // Migrate mistakes — extract base64 images into IndexedDB
    if (!localStorage.getItem(NEW_M)) {
      for (const k of OLD_KEYS) {
        const raw = localStorage.getItem(k);
        if (!raw) continue;
        try {
          const items = JSON.parse(raw);
          if (!Array.isArray(items) || items.length === 0) continue;
          const cleaned = await Promise.all(items.map(async q => {
            const clean = {
              ...q
            };

            // Move main imageUrl to IndexedDB
            if (q.imageUrl && q.imageUrl.startsWith('data:')) {
              const k2 = imgKey(q.id, 'main');
              await ImgDB.save(k2, q.imageUrl);
              clean.imageUrl = '';
              clean.imageKey = k2;
            }

            // Move explanation block images to IndexedDB
            if (Array.isArray(q.explanationBlocks)) {
              clean.explanationBlocks = await Promise.all(q.explanationBlocks.map(async b => {
                if (b.type === 'image' && b.value && b.value.startsWith('data:')) {
                  const bk = expImgKey(q.id, b.id);
                  await ImgDB.save(bk, b.value);
                  return {
                    ...b,
                    value: '',
                    imageKey: bk
                  };
                }
                return b;
              }));
            }
            delete clean.imageUrl; // will use imageKey going forward
            if (!clean.imageKey) clean.imageKey = '';
            return clean;
          }));
          localStorage.setItem(NEW_M, JSON.stringify(cleaned));
          console.log('[MistakeVault] Migrated', cleaned.length, 'mistakes from', k, '— images moved to IndexedDB ✅');
          break;
        } catch (e) {
          console.warn('Migration parse error', e);
        }
      }
    }

    // Migrate PYQs
    const OLD_PYQ_KEYS = ['mv_pyqs_v3'];
    if (!localStorage.getItem(NEW_P)) {
      for (const k of OLD_PYQ_KEYS) {
        const raw = localStorage.getItem(k);
        if (!raw) continue;
        try {
          const items = JSON.parse(raw);
          if (!Array.isArray(items) || items.length === 0) continue;
          const cleaned = await Promise.all(items.map(async q => {
            const clean = {
              ...q
            };
            if (q.imageUrl && q.imageUrl.startsWith('data:')) {
              const k2 = imgKey(q.id, 'pyq_main');
              await ImgDB.save(k2, q.imageUrl);
              clean.imageKey = k2;
            }
            delete clean.imageUrl;
            if (!clean.imageKey) clean.imageKey = '';
            return clean;
          }));
          localStorage.setItem(NEW_P, JSON.stringify(cleaned));
          break;
        } catch (e) {}
      }
    }
  } catch (e) {
    console.warn('Migration error:', e);
  }
}
