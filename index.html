const {useState,useEffect,useRef,useMemo,useCallback}=React;

// ══════════════════════════════════════════════════════════════════════
//  STORAGE ENGINE
//  ─ Text/metadata  → localStorage  (stable keys, never changes)
//  ─ Images         → IndexedDB as Blob  (NOT dataURL, NOT objectURL)
//    Why Blob?  dataURL strings are huge text (33% overhead) and still
//    live in RAM. Blobs are binary, stored efficiently on disk by the
//    browser, and survive page reloads, cache clears of other origins,
//    and code updates forever.
//  ─ Export Backup  → single .json file  (text + base64 images inline)
//  ─ Import Backup  → restores everything from that .json
// ══════════════════════════════════════════════════════════════════════

/* ── IndexedDB ── */
const IDB = (() => {
  const NAME = 'MistakeVaultDB';
  const VER  = 2;
  const IMG_STORE  = 'images';   // stores Blobs keyed by string
  let _db = null;

  function open() {
    if (_db) return Promise.resolve(_db);
    return new Promise((res, rej) => {
      const req = indexedDB.open(NAME, VER);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(IMG_STORE))
          db.createObjectStore(IMG_STORE);
      };
      req.onsuccess = e => { _db = e.target.result; res(_db); };
      req.onerror   = e => rej(e.target.error);
    });
  }

  // Save a File/Blob under key
  async function saveBlob(key, blob) {
    if (!key || !blob) return;
    const db = await open();
    return new Promise((res, rej) => {
      const tx = db.transaction(IMG_STORE, 'readwrite');
      tx.objectStore(IMG_STORE).put(blob, key);
      tx.oncomplete = () => res(true);
      tx.onerror    = e => rej(e.target.error);
    });
  }

  // Load a Blob and return a stable object URL
  // We cache object URLs per key so we don't leak memory
  const _urlCache = {};
  async function loadURL(key) {
    if (!key) return null;
    if (_urlCache[key]) return _urlCache[key];
    const db = await open();
    const blob = await new Promise((res, rej) => {
      const tx  = db.transaction(IMG_STORE, 'readonly');
      const req = tx.objectStore(IMG_STORE).get(key);
      req.onsuccess = e => res(e.target.result || null);
      req.onerror   = e => rej(e.target.error);
    });
    if (!blob) return null;
    // createObjectURL is fine here because we cache it for the session
    // The Blob itself is persisted in IDB — the URL is just a view pointer
    const url = URL.createObjectURL(blob);
    _urlCache[key] = url;
    return url;
  }

  function invalidateCache(key) { delete _urlCache[key]; }

  async function remove(key) {
    if (!key) return;
    invalidateCache(key);
    const db = await open();
    return new Promise((res, rej) => {
      const tx = db.transaction(IMG_STORE, 'readwrite');
      tx.objectStore(IMG_STORE).delete(key);
      tx.oncomplete = () => res(true);
      tx.onerror    = e => rej(e.target.error);
    });
  }

  // For export: return base64 dataURL string for a key
  async function toDataURL(key) {
    if (!key) return null;
    const db = await open();
    const blob = await new Promise((res, rej) => {
      const tx  = db.transaction(IMG_STORE, 'readonly');
      const req = tx.objectStore(IMG_STORE).get(key);
      req.onsuccess = e => res(e.target.result || null);
      req.onerror   = e => rej(e.target.error);
    });
    if (!blob) return null;
    return new Promise(res => {
      const r = new FileReader();
      r.onload = e => res(e.target.result);
      r.readAsDataURL(blob);
    });
  }

  // For import: save a dataURL string as a Blob
  async function fromDataURL(key, dataURL) {
    if (!key || !dataURL) return;
    const res = await fetch(dataURL);
    const blob = await res.blob();
    invalidateCache(key);
    return saveBlob(key, blob);
  }

  // List all keys (for export/cleanup)
  async function allKeys() {
    const db = await open();
    return new Promise((res, rej) => {
      const tx  = db.transaction(IMG_STORE, 'readonly');
      const req = tx.objectStore(IMG_STORE).getAllKeys();
      req.onsuccess = e => res(e.target.result);
      req.onerror   = e => rej(e.target.error);
    });
  }

  return { saveBlob, loadURL, remove, toDataURL, fromDataURL, allKeys };
})();

/* ── localStorage — stable keys, never changes ── */
const LS = {
  SUBJECTS : 'mv5_subjects',
  MISTAKES : 'mv5_mistakes',
  PYQS     : 'mv5_pyqs',
};

function lsGet(key, def) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; }
  catch { return def; }
}
function lsSet(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) { console.warn('LS full?', e); }
}

/* ── useLocalStorage hook ── */
function useLS(key, init) {
  const [val, setVal] = useState(() => lsGet(key, init));
  useEffect(() => lsSet(key, val), [key, val]);
  return [val, setVal];
}

/* ── useImage hook — loads Blob URL from IDB ── */
function useImage(key) {
  const [url, setUrl] = useState(null);
  useEffect(() => {
    if (!key) { setUrl(null); return; }
    let alive = true;
    IDB.loadURL(key).then(u => { if (alive) setUrl(u); }).catch(() => { if (alive) setUrl(null); });
    return () => { alive = false; };
  }, [key]);
  return url;
}

/* helper to convert File → Blob and save, returns imageKey */
async function saveImageFile(file, existingKey) {
  const key = existingKey || ('img_' + Date.now() + '_' + Math.random().toString(36).slice(2));
  // store as-is (File extends Blob)
  await IDB.saveBlob(key, file);
  IDB.invalidateCache(key);
  return key;
}

// ══════════════════════════════════════════════════════════════════════
//  BACKUP — Export & Import
// ══════════════════════════════════════════════════════════════════════

async function exportBackup(mistakes, pyqs, subjects) {
  // Collect all image keys referenced by data
  const allImgKeys = new Set();
  const collectKeys = items => items.forEach(q => {
    if (q.imageKey) allImgKeys.add(q.imageKey);
    (q.explanationBlocks||[]).forEach(b => { if (b.imageKey) allImgKeys.add(b.imageKey); });
  });
  collectKeys(mistakes);
  collectKeys(pyqs);

  // Fetch all images as dataURLs
  const images = {};
  for (const k of allImgKeys) {
    const d = await IDB.toDataURL(k);
    if (d) images[k] = d;
  }

  const backup = {
    version: 5,
    exportedAt: new Date().toISOString(),
    subjects, mistakes, pyqs, images
  };

  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = `MistakeVault_Backup_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

async function importBackup(file, setSubjects, setMistakes, setPyqs) {
  return new Promise((res, rej) => {
    const reader = new FileReader();
    reader.onload = async e => {
      try {
        const backup = JSON.parse(e.target.result);
        if (!backup.version || !backup.mistakes) throw new Error('Invalid backup file');

        // Restore images to IDB
        const imgs = backup.images || {};
        for (const [k, dataURL] of Object.entries(imgs)) {
          await IDB.fromDataURL(k, dataURL);
        }

        // Restore text data to localStorage
        if (backup.subjects?.length) setSubjects(backup.subjects);
        if (backup.mistakes?.length) setMistakes(backup.mistakes);
        if (backup.pyqs?.length)     setPyqs(backup.pyqs);

        res({ mistakes: backup.mistakes?.length||0, pyqs: backup.pyqs?.length||0, images: Object.keys(imgs).length });
      } catch(err) { rej(err); }
    };
    reader.onerror = rej;
    reader.readAsText(file);
  });
}

// ══════════════════════════════════════════════════════════════════════
//  MIGRATION — bring data from old versions (v3/v4) into v5
// ══════════════════════════════════════════════════════════════════════
async function migrate() {
  if (lsGet(LS.MISTAKES, null) !== null) return; // already on v5

  const OLD_M = ['mv_mistakes_v4','mv_mistakes_v3','mt_questions_v2','mt_questions'];
  const OLD_S = ['mv_subjects_v4','mv_subjects_v3','mt_subjects_v2','mt_subjects'];
  const OLD_P = ['mv_pyqs_v4','mv_pyqs_v3'];

  // Subjects
  for (const k of OLD_S) {
    const v = lsGet(k, null);
    if (v) { lsSet(LS.SUBJECTS, v); break; }
  }

  // Mistakes — dataURL images move to IDB as Blobs
  for (const k of OLD_M) {
    const v = lsGet(k, null);
    if (!v || !v.length) continue;
    const cleaned = await Promise.all(v.map(async q => {
      const c = { ...q };
      // main image
      if (q.imageUrl?.startsWith('data:') && !q.imageKey) {
        const key = 'img_m_' + q.id;
        await IDB.fromDataURL(key, q.imageUrl);
        c.imageKey = key;
      }
      delete c.imageUrl;
      if (!c.imageKey) c.imageKey = '';
      // explanation blocks
      if (Array.isArray(q.explanationBlocks)) {
        c.explanationBlocks = await Promise.all(q.explanationBlocks.map(async b => {
          if (b.type === 'image' && b.value?.startsWith('data:') && !b.imageKey) {
            const key = 'img_exp_' + q.id + '_' + b.id;
            await IDB.fromDataURL(key, b.value);
            return { ...b, imageKey: key, value: undefined };
          }
          return b;
        }));
      }
      return c;
    }));
    lsSet(LS.MISTAKES, cleaned);
    break;
  }
  if (!lsGet(LS.MISTAKES, null)) lsSet(LS.MISTAKES, []);

  // PYQs
  for (const k of OLD_P) {
    const v = lsGet(k, null);
    if (!v || !v.length) continue;
    const cleaned = await Promise.all(v.map(async q => {
      const c = { ...q };
      if (q.imageUrl?.startsWith('data:') && !q.imageKey) {
        const key = 'img_p_' + q.id;
        await IDB.fromDataURL(key, q.imageUrl);
        c.imageKey = key;
      }
      delete c.imageUrl;
      if (!c.imageKey) c.imageKey = '';
      return c;
    }));
    lsSet(LS.PYQS, cleaned);
    break;
  }
  if (!lsGet(LS.PYQS, null)) lsSet(LS.PYQS, []);
}

function Modal({children,onClose,title,wide}){
  useEffect(()=>{const h=e=>{if(e.key==='Escape')onClose()};window.addEventListener('keydown',h);return()=>window.removeEventListener('keydown',h)},[]);
  return(
    <div onClick={onClose} style={{position:'fixed',inset:0,background:'rgba(0,0,0,.85)',display:'flex',alignItems:'flex-start',justifyContent:'center',zIndex:1000,overflowY:'auto',padding:'32px 16px',backdropFilter:'blur(4px)'}}>
      <div onClick={e=>e.stopPropagation()} style={{background:'#0f1422',border:'1px solid #1e2540',borderRadius:14,width:'100%',maxWidth:wide?800:520,padding:24,marginBottom:40,boxShadow:'0 25px 60px rgba(0,0,0,.7)',animation:'fadeIn .15s ease'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
          <h2 style={{fontSize:15,fontWeight:700,color:'#e2e8f0'}}>{title}</h2>
          <button onClick={onClose} style={{background:'#1a1f35',border:'none',color:'#64748b',fontSize:18,width:28,height:28,borderRadius:6,display:'flex',alignItems:'center',justifyContent:'center'}}>×</button>
        </div>
        {children}
      </div>
    </div>
  )
}

function TagInput({tags,onChange,suggestions}){
  const[inp,setInp]=useState('');
  const add=t=>{t=t.startsWith('#')?t:'#'+t;if(t.length>1&&!tags.includes(t))onChange([...tags,t]);setInp('')};
  return(
    <div>
      {tags.length>0&&<div style={{display:'flex',flexWrap:'wrap',gap:5,marginBottom:8}}>
        {tags.map(t=><span key={t} style={{background:'#1a1f35',border:'1px solid #252b42',borderRadius:6,padding:'2px 8px',fontSize:11,display:'flex',alignItems:'center',gap:4,color:'#94a3b8'}}>
          {t}<button onClick={()=>onChange(tags.filter(x=>x!==t))} style={{background:'none',border:'none',color:'#475569',fontSize:13,padding:0,lineHeight:1}}>×</button>
        </span>)}
      </div>}
      <input value={inp} onChange={e=>setInp(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'){e.preventDefault();inp.trim()&&add(inp.trim())}}} placeholder="Type tag + Enter"/>
      <div style={{display:'flex',flexWrap:'wrap',gap:5,marginTop:6}}>
        {(suggestions||[]).map(t=>!tags.includes(t)&&<button key={t} onClick={()=>add(t)} style={{background:'#131929',border:'1px solid #1e2540',borderRadius:5,padding:'2px 7px',fontSize:10,color:'#64748b'}}>{t}</button>)}
      </div>
    </div>
  )
}

// ══════════════════════════════════════════════════════════════════════
//  IMAGE UPLOAD FIELD
//  Saves File as Blob in IDB. Returns imageKey (string), never dataURL.
// ══════════════════════════════════════════════════════════════════════
function ImageUploadField({imageKey, onSave, onRemove}){
  const ref = useRef();
  const url = useImage(imageKey);

  const handleFile = useCallback(async file => {
    if (!file) return;
    const newKey = imageKey || ('img_' + Date.now());
    await IDB.saveBlob(newKey, file);
    IDB.invalidateCache(newKey);
    onSave(newKey);
  }, [imageKey, onSave]);

  // Clipboard paste
  useEffect(()=>{
    const h = async e => {
      const items = e.clipboardData?.items;
      if (!items) return;
      for (const item of items) {
        if (item.type.startsWith('image/')) {
          await handleFile(item.getAsFile());
          e.preventDefault(); break;
        }
      }
    };
    window.addEventListener('paste', h);
    return () => window.removeEventListener('paste', h);
  }, [handleFile]);

  return(
    <div>
      {url?(
        <div style={{position:'relative',marginBottom:8}}>
          <img src={url} alt="screenshot" style={{width:'100%',borderRadius:8,maxHeight:260,objectFit:'contain',background:'#060912',border:'1px solid #1e2540'}}/>
          <button onClick={async()=>{if(imageKey)await IDB.remove(imageKey);onRemove();}}
            style={{position:'absolute',top:8,right:8,background:'#ef4444cc',border:'none',borderRadius:6,color:'#fff',padding:'3px 10px',fontSize:11,fontWeight:600}}>Remove</button>
        </div>
      ):(
        <div onClick={()=>ref.current.click()}
          style={{border:'2px dashed #1e2540',borderRadius:8,padding:20,textAlign:'center',cursor:'pointer',color:'#3d4460',fontSize:13,transition:'all .2s'}}
          onMouseEnter={e=>{e.currentTarget.style.borderColor='#6366f1';e.currentTarget.style.color='#818cf8'}}
          onMouseLeave={e=>{e.currentTarget.style.borderColor='#1e2540';e.currentTarget.style.color='#3d4460'}}>
          📷 Click to upload · <strong>Ctrl+V</strong> to paste · saved as Blob permanently
        </div>
      )}
      <input ref={ref} type="file" accept="image/*" onChange={e=>handleFile(e.target.files[0])} style={{display:'none'}}/>
      {url&&<button onClick={()=>ref.current.click()} style={{marginTop:6,background:'#131929',border:'1px solid #1e2540',borderRadius:7,color:'#64748b',padding:'5px 12px',fontSize:12}}>Change</button>}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════════
//  EXPLANATION EDITOR  (text + image blocks, images stored as Blobs)
// ══════════════════════════════════════════════════════════════════════
function ExpImgBlock({imageKey}){
  const url=useImage(imageKey);
  return url?<img src={url} alt="exp" style={{width:'100%',borderRadius:6,marginBottom:8,maxHeight:260,objectFit:'contain',background:'#060912',border:'1px solid #1e2540'}}/>:
    <div style={{padding:12,textAlign:'center',color:'#374151',fontSize:11,border:'1px dashed #1e2540',borderRadius:6,marginBottom:8}}>Loading image...</div>;
}

function ExplanationEditor({blocks, onChange, qId}){
  const fileRef = useRef();

  const addText=()=>onChange([...blocks,{id:'b'+Date.now(),type:'text',value:''}]);

  const addFile=useCallback(async file=>{
    if(!file)return;
    const id='b'+Date.now();
    const key='img_exp_'+(qId||'new')+'_'+id;
    await IDB.saveBlob(key, file);
    IDB.invalidateCache(key);
    onChange([...blocks,{id,type:'image',imageKey:key}]);
    if(fileRef.current)fileRef.current.value='';
  },[blocks,qId,onChange]);

  useEffect(()=>{
    const h=async e=>{
      const items=e.clipboardData?.items;if(!items)return;
      for(const item of items){
        if(item.type.startsWith('image/')){await addFile(item.getAsFile());e.preventDefault();break;}
      }
    };
    window.addEventListener('paste',h);return()=>window.removeEventListener('paste',h);
  },[addFile]);

  const upd=(i,b)=>{const a=[...blocks];a[i]=b;onChange(a)};
  const rem=async i=>{
    const b=blocks[i];
    if(b.type==='image'&&b.imageKey)await IDB.remove(b.imageKey);
    onChange(blocks.filter((_,j)=>j!==i));
  };
  const mv=(i,d)=>{const a=[...blocks];const t=i+d;if(t<0||t>=a.length)return;[a[i],a[t]]=[a[t],a[i]];onChange(a)};

  return(
    <div style={{border:'1px solid #252b42',borderRadius:8,overflow:'hidden'}}>
      <div style={{background:'#131929',padding:'6px 10px',display:'flex',gap:6,alignItems:'center',borderBottom:'1px solid #1a1f35'}}>
        <button type="button" onClick={addText} style={{background:'#1a1f35',border:'1px solid #252b42',borderRadius:6,color:'#94a3b8',padding:'4px 10px',fontSize:11,fontWeight:600}}>+ Text</button>
        <button type="button" onClick={()=>fileRef.current.click()} style={{background:'#1a1f35',border:'1px solid #252b42',borderRadius:6,color:'#94a3b8',padding:'4px 10px',fontSize:11,fontWeight:600}}>🖼 Image</button>
        <span style={{fontSize:10,color:'#374151',marginLeft:4}}>Ctrl+V to paste · stored as Blob</span>

      </div>
      <div style={{background:'#0f1422',padding:blocks.length?8:0,display:'flex',flexDirection:'column',gap:6}}>
        {blocks.length===0&&<div style={{padding:20,textAlign:'center',color:'#374151',fontSize:12}}>
          Click <strong style={{color:'#6366f1'}}>+ Text</strong> or <strong style={{color:'#6366f1'}}>🖼 Image</strong> to build your explanation
        </div>}
        {blocks.map((b,i)=>(
          <div key={b.id} style={{display:'flex',gap:6,alignItems:'flex-start'}}>
            <div style={{flex:1}}>
              {b.type==='text'?(
                <textarea value={b.value||''} onChange={e=>upd(i,{...b,value:e.target.value})} placeholder="Write explanation..." rows={3}
                  style={{flex:1,width:'100%',resize:'vertical',fontSize:13,background:'#131929',border:'1px solid #1e2540',borderRadius:6,padding:'8px 10px',color:'#e2e8f0',fontFamily:'inherit'}}/>
              ):(
                <ExpImgBlock imageKey={b.imageKey}/>
              )}
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:3,flexShrink:0}}>
              <button type="button" onClick={()=>mv(i,-1)} disabled={i===0} style={{background:'#131929',border:'1px solid #1e2540',borderRadius:5,color:i===0?'#2a3050':'#64748b',padding:'3px 6px',fontSize:10}}>▲</button>
              <button type="button" onClick={()=>mv(i,1)} disabled={i===blocks.length-1} style={{background:'#131929',border:'1px solid #1e2540',borderRadius:5,color:i===blocks.length-1?'#2a3050':'#64748b',padding:'3px 6px',fontSize:10}}>▼</button>
              <button type="button" onClick={()=>rem(i)} style={{background:'#1a0a0a',border:'1px solid #3f1515',borderRadius:5,color:'#ef4444',padding:'3px 6px',fontSize:10}}>✕</button>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════════
function MistakeForm({q,subjects,defSub,defCh,onSave,onClose}){
  const qId=useRef(q?.id||('new_'+Date.now())).current;
  const initBlocks=()=>{
    if(q?.explanationBlocks)return q.explanationBlocks;
    if(q?.explanation)return[{id:'b0',type:'text',value:q.explanation}];
    return[];
  };
  const[f,setF]=useState({title:q?.title||'',subject:q?.subject||defSub||'dm',chapter:q?.chapter||defCh||'',mistakeType:q?.mistakeType||'Concept Mistake',difficulty:q?.difficulty||'Medium',tags:q?.tags||[],status:q?.status||'New',notes:q?.notes||'',solutionLink:q?.solutionLink||'',imageKey:q?.imageKey||''});
  const[exp,setExp]=useState(initBlocks);
  const sub=subjects.find(s=>s.id===f.subject)||subjects[0];
  const s=(k,v)=>setF(p=>({...p,[k]:v}));
  const save=()=>{
    if(!f.title.trim()){alert('Please enter a question title');return;}
    onSave({...f,explanationBlocks:exp,id:q?.id||qId,date:q?.date||new Date().toISOString().slice(0,10)});
    onClose();
  };
  return(
    <div style={{display:'flex',flexDirection:'column',gap:13,maxHeight:'72vh',overflowY:'auto',paddingRight:4}}>
      <div><label>Question Title *</label><input value={f.title} onChange={e=>s('title',e.target.value)} placeholder="Brief description"/></div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
        <div><label>Subject</label><select value={f.subject} onChange={e=>{s('subject',e.target.value);s('chapter','')}}>
          {subjects.map(x=><option key={x.id} value={x.id}>{x.name}</option>)}</select></div>
        <div><label>Chapter</label><select value={f.chapter} onChange={e=>s('chapter',e.target.value)}>
          <option value="">-- Select --</option>{sub.chapters.map(c=><option key={c}>{c}</option>)}</select></div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10}}>
        <div><label>Mistake Type</label><select value={f.mistakeType} onChange={e=>s('mistakeType',e.target.value)}>{MISTAKE_TYPES.map(m=><option key={m}>{m}</option>)}</select></div>
        <div><label>Difficulty</label><select value={f.difficulty} onChange={e=>s('difficulty',e.target.value)}>{DIFFICULTIES.map(d=><option key={d}>{d}</option>)}</select></div>
        <div><label>Status</label><select value={f.status} onChange={e=>s('status',e.target.value)}>{MISTAKE_STATUSES.map(x=><option key={x}>{x}</option>)}</select></div>
      </div>
      <div><label>Question Screenshot (Blob — permanent)</label><ImageUploadField imageKey={f.imageKey} onSave={k=>s('imageKey',k)} onRemove={()=>s('imageKey','')}/></div>
      <div><label>My Explanation</label><ExplanationEditor blocks={exp} onChange={setExp} qId={qId}/></div>
      <div><label>Solution Link</label><input value={f.solutionLink} onChange={e=>s('solutionLink',e.target.value)} placeholder="YouTube / website / drive"/></div>
      <div><label>Key Learning Note</label><textarea value={f.notes} onChange={e=>s('notes',e.target.value)} rows={2} placeholder="What to remember?"/></div>
      <div><label>Tags</label><TagInput tags={f.tags} onChange={v=>s('tags',v)} suggestions={TAGS_MISTAKE}/></div>
      <div style={{display:'flex',gap:10,justifyContent:'flex-end',paddingTop:12,borderTop:'1px solid #1a1f35'}}>
        <button onClick={onClose} style={{background:'none',border:'1px solid #1e2540',borderRadius:8,color:'#64748b',padding:'8px 16px',fontSize:13}}>Cancel</button>
        <button onClick={save} style={{background:'linear-gradient(135deg,#6366f1,#8b5cf6)',border:'none',borderRadius:8,color:'#fff',padding:'8px 20px',fontSize:13,fontWeight:700}}>Save</button>
      </div>
    </div>
  );
}

function PYQForm({q,subjects,defSub,defCh,onSave,onClose}){

// ══════════════════════════════════════════════════════════════════════
//  BACKUP MODAL
// ══════════════════════════════════════════════════════════════════════
function BackupModal({mistakes,pyqs,subjects,setSubjects,setMistakes,setPyqs,onClose}){
  const[status,setStatus]=useState('');
  const[loading,setLoading]=useState(false);
  const fileRef=useRef();

  const doExport=async()=>{
    setLoading(true);setStatus('Preparing backup...');
    try{await exportBackup(mistakes,pyqs,subjects);setStatus(`✅ Backup downloaded! (${mistakes.length} mistakes, ${pyqs.length} PYQs)`);}
    catch(e){setStatus('❌ Export failed: '+e.message);}
    setLoading(false);
  };

  const doImport=async file=>{
    if(!file)return;
    if(!window.confirm('Import will MERGE with your current data. Continue?'))return;
    setLoading(true);setStatus('Importing...');
    try{
      const r=await importBackup(file,setSubjects,setMistakes,setPyqs);
      setStatus(`✅ Imported! ${r.mistakes} mistakes, ${r.pyqs} PYQs, ${r.images} images`);
    }catch(e){setStatus('❌ Import failed: '+e.message);}
    setLoading(false);
  };

  return(
    <div style={{display:'flex',flexDirection:'column',gap:16}}>
      <div style={{background:'#0a1628',border:'1px solid #06b6d433',borderRadius:10,padding:16}}>
        <p style={{fontSize:13,fontWeight:700,color:'#22d3ee',marginBottom:6}}>📦 Export Backup</p>
        <p style={{fontSize:12,color:'#475569',marginBottom:12,lineHeight:1.6}}>Downloads a single <strong style={{color:'#94a3b8'}}>.json</strong> file containing all your questions, PYQs, subjects, and images. Save it to Google Drive or your PC regularly.</p>
        <button onClick={doExport} disabled={loading} style={{background:'linear-gradient(135deg,#06b6d4,#0ea5e9)',border:'none',borderRadius:8,color:'#fff',padding:'9px 20px',fontSize:13,fontWeight:700,opacity:loading?.6:1}}>
          ⬇ Download Backup ({mistakes.length+pyqs.length} items)
        </button>
      </div>
      <div style={{background:'#1a0f05',border:'1px solid #f59e0b33',borderRadius:10,padding:16}}>
        <p style={{fontSize:13,fontWeight:700,color:'#f59e0b',marginBottom:6}}>📂 Import Backup</p>
        <p style={{fontSize:12,color:'#475569',marginBottom:12,lineHeight:1.6}}>Restore from a previously exported <strong style={{color:'#94a3b8'}}>.json</strong> backup file. This merges imported data with your current data.</p>
        <button onClick={()=>fileRef.current.click()} disabled={loading} style={{background:'linear-gradient(135deg,#f59e0b,#d97706)',border:'none',borderRadius:8,color:'#fff',padding:'9px 20px',fontSize:13,fontWeight:700,opacity:loading?.6:1}}>
          ⬆ Import from Backup
        </button>
        <input ref={fileRef} type="file" accept=".json" onChange={e=>doImport(e.target.files[0])} style={{display:'none'}}/>
      </div>
      <div style={{background:'#131929',border:'1px solid #1e2540',borderRadius:10,padding:14}}>
        <p style={{fontSize:11,fontWeight:700,color:'#475569',marginBottom:6,textTransform:'uppercase',letterSpacing:.5}}>💡 Recommendation</p>
        <p style={{fontSize:12,color:'#475569',lineHeight:1.7}}>
          Export backup every <strong style={{color:'#94a3b8'}}>week</strong> and save to Google Drive.<br/>
          This protects against browser cache clears, OS reinstalls, or switching devices.<br/>
          <strong style={{color:'#f59e0b'}}>Images are included</strong> in the backup file.
        </p>
      </div>
      {status&&<div style={{background:status.startsWith('✅')?'#052010':'#1a0505',border:`1px solid ${status.startsWith('✅')?'#22c55e33':'#ef444433'}`,borderRadius:8,padding:'10px 14px',fontSize:13,color:status.startsWith('✅')?'#22c55e':'#ef4444'}}>{status}</div>}
      {loading&&<div style={{display:'flex',alignItems:'center',gap:8,color:'#475569',fontSize:12}}>
        <div style={{width:16,height:16,border:'2px solid #1e2540',borderTopColor:'#6366f1',borderRadius:'50%',animation:'spin 1s linear infinite'}}/>Processing...
      </div>}
      <div style={{display:'flex',justifyContent:'flex-end'}}>
        <button onClick={onClose} style={{background:'none',border:'1px solid #1e2540',borderRadius:8,color:'#64748b',padding:'8px 16px',fontSize:13}}>Close</button>
      </div>
    </div>
  );
}

//  DASHBOARD
// ══════════════════════════════════════════════════════════════════════
function Dashboard({mistakes,pyqs,subjects,onBackup}){
  const totalM=mistakes.length,totalP=pyqs.length;
  const impP=pyqs.filter(q=>q.isImportant).length;
  const discP=pyqs.filter(q=>q.status==='Need Discussion').length;
  const needRevM=mistakes.filter(q=>q.status==='Need Revision'||q.tags?.includes('#revise'));
  const weakest=subjects.map(s=>({s,cnt:mistakes.filter(q=>q.subject===s.id).length})).sort((a,b)=>b.cnt-a.cnt)[0];
  const maxM=Math.max(1,...subjects.map(s=>mistakes.filter(q=>q.subject===s.id).length));
  const maxP=Math.max(1,...subjects.map(s=>pyqs.filter(q=>q.subject===s.id).length));
  return(
    <div style={{paddingBottom:20}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:24,flexWrap:'wrap',gap:12}}>
        <div>
          <h2 style={{fontSize:20,fontWeight:800,color:'#e2e8f0',letterSpacing:-.5}}>Dashboard</h2>
          <p style={{fontSize:13,color:'#475569',marginTop:2}}>Your GATE prep overview</p>
        </div>
        <button onClick={onBackup} style={{background:'linear-gradient(135deg,#f59e0b,#d97706)',border:'none',borderRadius:8,color:'#fff',padding:'8px 16px',fontSize:12,fontWeight:700,display:'flex',alignItems:'center',gap:6}}>
          💾 Backup / Restore
        </button>
      </div>
      {/* Notice banner */}
      <div style={{background:'#0a1a0a',border:'1px solid #22c55e33',borderRadius:10,padding:'10px 14px',marginBottom:20,display:'flex',alignItems:'center',gap:10}}>
        <span style={{fontSize:16}}>🛡️</span>
        <p style={{fontSize:12,color:'#4ade80',lineHeight:1.5}}>Images stored as <strong>Blobs in IndexedDB</strong> — permanent, no size limit. Export backup weekly to Google Drive for extra safety.</p>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(130px,1fr))',gap:10,marginBottom:28}}>
        {[['Mistakes','#6366f1',totalM],['PYQs','#06b6d4',totalP],['Important','#f59e0b',impP],['Discussion','#ef4444',discP],['Need Revision','#ef4444',needRevM.length],['Mastered','#22c55e',mistakes.filter(q=>q.status==='Mastered').length]].map(([l,c,v])=>(
          <div key={l} style={{background:'#0d1120',border:'1px solid #1a1f35',borderRadius:10,padding:'14px 12px',textAlign:'center'}}>
            <p style={{fontSize:10,color:'#475569',marginBottom:6,fontWeight:600,textTransform:'uppercase',letterSpacing:.5}}>{l}</p>
            <p style={{fontSize:26,fontWeight:800,color:c}}>{v}</p>
          </div>
        ))}
      </div>
      {weakest?.cnt>0&&<div style={{background:'#1a0a0a',border:'1px solid #3f1515',borderRadius:10,padding:'12px 16px',marginBottom:20,display:'flex',alignItems:'center',gap:12}}>
        <span style={{fontSize:20}}>⚠️</span>
        <div><p style={{fontSize:11,color:'#ef4444',fontWeight:700,marginBottom:2}}>WEAKEST SUBJECT</p><p style={{fontSize:13,color:'#fca5a5'}}>{weakest.s.name} — {weakest.cnt} mistakes</p></div>
      </div>}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20,marginBottom:24}}>
        <div>
          <h3 style={{fontSize:11,fontWeight:700,color:'#475569',marginBottom:12,textTransform:'uppercase',letterSpacing:.5}}>Mistakes by Subject</h3>
          <div style={{display:'flex',flexDirection:'column',gap:8}}>
            {subjects.map(s=>{const c=mistakes.filter(q=>q.subject===s.id).length;return(
              <div key={s.id} style={{display:'flex',alignItems:'center',gap:8}}>
                <span style={{fontSize:11,color:'#64748b',width:100,flexShrink:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{s.name}</span>
                <div style={{flex:1,background:'#131929',borderRadius:3,height:6,overflow:'hidden'}}>
                  <div style={{width:c?`${(c/maxM)*100}%`:'0',background:s.color,height:'100%',borderRadius:3,transition:'width .6s'}}/>
                </div>
                <span style={{fontSize:11,color:c?s.color:'#374151',minWidth:20,textAlign:'right',fontWeight:700}}>{c}</span>
              </div>
            )})}
          </div>
        </div>
        <div>
          <h3 style={{fontSize:11,fontWeight:700,color:'#475569',marginBottom:12,textTransform:'uppercase',letterSpacing:.5}}>PYQs by Subject</h3>
          <div style={{display:'flex',flexDirection:'column',gap:8}}>
            {subjects.map(s=>{const c=pyqs.filter(q=>q.subject===s.id).length;return(
              <div key={s.id} style={{display:'flex',alignItems:'center',gap:8}}>
                <span style={{fontSize:11,color:'#64748b',width:100,flexShrink:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{s.name}</span>
                <div style={{flex:1,background:'#131929',borderRadius:3,height:6,overflow:'hidden'}}>
                  <div style={{width:c?`${(c/maxP)*100}%`:'0',background:'#06b6d4',height:'100%',borderRadius:3,transition:'width .6s'}}/>
                </div>
                <span style={{fontSize:11,color:c?'#06b6d4':'#374151',minWidth:20,textAlign:'right',fontWeight:700}}>{c}</span>
              </div>
            )})}
          </div>
        </div>
      </div>
      {needRevM.length>0&&<div>
        <h3 style={{fontSize:11,fontWeight:700,color:'#ef4444',marginBottom:10,textTransform:'uppercase',letterSpacing:.5}}>Flagged for Revision ({needRevM.length})</h3>
        <div style={{display:'flex',flexDirection:'column',gap:5}}>
          {needRevM.slice(0,5).map(q=><div key={q.id} style={{background:'#0d1120',border:'1px solid #ef444420',borderRadius:7,padding:'8px 12px',display:'flex',justifyContent:'space-between',gap:10}}>
            <span style={{fontSize:12,color:'#cbd5e1',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{q.title}</span>
            <span style={{fontSize:10,color:'#475569',flexShrink:0}}>{subjects.find(s=>s.id===q.subject)?.name}</span>
          </div>)}
          {needRevM.length>5&&<p style={{fontSize:11,color:'#475569',textAlign:'center',padding:'6px 0'}}>+{needRevM.length-5} more</p>}
        </div>
      </div>}
      {totalM===0&&totalP===0&&<div style={{textAlign:'center',padding:'40px 20px',background:'#0d1120',borderRadius:12,border:'1px dashed #1e2540',marginTop:20}}>
        <p style={{fontSize:32,marginBottom:10}}>🎯</p>
        <p style={{fontSize:14,color:'#475569'}}>Click a subject to start adding mistakes or PYQs!</p>
      </div>}
    </div>
  );
}

function EmptyState({type}){
  return(

}

// ══════════════════════════════════════════════════════════════════════
//  MAIN APP
// ══════════════════════════════════════════════════════════════════════
function App(){
  const[ready,setReady]=useState(false);
  const[subjects,setSubjects]=useLS(LS.SUBJECTS, SUBJECTS_DEFAULT);
  const[mistakes,setMistakes]=useLS(LS.MISTAKES, []);
  const[pyqs,setPyqs]=useLS(LS.PYQS, []);

  const[view,setView]=useState('dashboard');
  const[selSub,setSelSub]=useState(null);
  const[selMode,setSelMode]=useState(null);
  const[selChapter,setSelChapter]=useState(null);
  const[showAddM,setShowAddM]=useState(false);
  const[showAddP,setShowAddP]=useState(false);
  const[editM,setEditM]=useState(null);
  const[editP,setEditP]=useState(null);
  const[viewM,setViewM]=useState(null);
  const[viewP,setViewP]=useState(null);
  const[showAddSub,setShowAddSub]=useState(false);
  const[showAddCh,setShowAddCh]=useState(false);
  const[showDelCh,setShowDelCh]=useState(false);
  const[showBackup,setShowBackup]=useState(false);
  const[newSubName,setNewSubName]=useState('');
  const[newChName,setNewChName]=useState('');
  const[search,setSearch]=useState('');
  const[filterM,setFilterM]=useState({subject:'',mistakeType:'',difficulty:'',status:''});
  const[filterP,setFilterP]=useState({subject:'',year:'',status:'',important:false,doubt:false});
  const[sidebarOpen,setSidebarOpen]=useState(true);

  useEffect(()=>{ migrate().then(()=>setReady(true)).catch(()=>setReady(true)); },[]);

  const sub=subjects.find(s=>s.id===selSub);
  const nav=(v,sid,mode,ch)=>{setView(v);if(sid!==undefined)setSelSub(sid);if(mode!==undefined)setSelMode(mode);if(ch!==undefined)setSelChapter(ch)};

  const visM=useMemo(()=>{
    let qs=mistakes;
    if(view==='chapter-m')qs=qs.filter(q=>q.subject===selSub&&q.chapter===selChapter);
    else if(view==='all-m'||view==='search'){
      if(filterM.subject)qs=qs.filter(q=>q.subject===filterM.subject);
      if(filterM.mistakeType)qs=qs.filter(q=>q.mistakeType===filterM.mistakeType);
      if(filterM.difficulty)qs=qs.filter(q=>q.difficulty===filterM.difficulty);
      if(filterM.status)qs=qs.filter(q=>q.status===filterM.status);
    }
    if(search.trim()){const s=search.toLowerCase();qs=qs.filter(q=>q.title?.toLowerCase().includes(s)||q.tags?.some(t=>t.includes(s))||q.notes?.toLowerCase().includes(s))}
    return qs;
  },[mistakes,view,selSub,selChapter,search,filterM]);

  const visP=useMemo(()=>{
    let qs=pyqs;
    if(view==='chapter-p')qs=qs.filter(q=>q.subject===selSub&&q.chapter===selChapter);
    else if(view==='all-p'||view==='search'){
      if(filterP.subject)qs=qs.filter(q=>q.subject===filterP.subject);
      if(filterP.year)qs=qs.filter(q=>q.year?.toLowerCase().includes(filterP.year.toLowerCase()));
      if(filterP.status)qs=qs.filter(q=>q.status===filterP.status);
      if(filterP.important)qs=qs.filter(q=>q.isImportant);
      if(filterP.doubt)qs=qs.filter(q=>q.isDoubt);
    }
    if(search.trim()){const s=search.toLowerCase();qs=qs.filter(q=>q.qNum?.toLowerCase().includes(s)||q.year?.toLowerCase().includes(s)||q.tags?.some(t=>t.includes(s))||q.notes?.toLowerCase().includes(s)||q.pageRef?.toLowerCase().includes(s))}
    return qs;
  },[pyqs,view,selSub,selChapter,search,filterP]);

  const saveM=q=>setMistakes(p=>{const i=p.findIndex(x=>x.id===q.id);return i>=0?p.map(x=>x.id===q.id?q:x):[q,...p]});
  const saveP=q=>setPyqs(p=>{const i=p.findIndex(x=>x.id===q.id);return i>=0?p.map(x=>x.id===q.id?q:x):[q,...p]});
  const delM=async id=>{
    const q=mistakes.find(x=>x.id===id);
    if(q?.imageKey)await IDB.remove(q.imageKey);
    for(const b of q?.explanationBlocks||[])if(b.imageKey)await IDB.remove(b.imageKey);
    setMistakes(p=>p.filter(x=>x.id!==id));setViewM(null);
  };
  const delP=async id=>{
    const q=pyqs.find(x=>x.id===id);
    if(q?.imageKey)await IDB.remove(q.imageKey);
    setPyqs(p=>p.filter(x=>x.id!==id));setViewP(null);
  };
  const addSubject=()=>{if(!newSubName.trim())return;const colors=['#818cf8','#34d399','#f472b6','#38bdf8','#fb923c','#a78bfa','#22d3ee','#fbbf24'];setSubjects(p=>[...p,{id:'s'+Date.now(),name:newSubName.trim(),color:colors[p.length%colors.length],chapters:[]}]);setNewSubName('');setShowAddSub(false)};
  const addChapter=()=>{if(!newChName.trim()||!selSub)return;setSubjects(p=>p.map(s=>s.id===selSub?{...s,chapters:[...s.chapters,newChName.trim()]}:s));setNewChName('');setShowAddCh(false)};
  const delChapter=ch=>{if(!window.confirm(`Delete chapter "${ch}"?`))return;setSubjects(p=>p.map(s=>s.id===selSub?{...s,chapters:s.chapters.filter(c=>c!==ch)}:s))};

  const isSearch=search.trim().length>0;

  if(!ready)return(
    <div style={{height:'100vh',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:12,background:'#0a0d14'}}>
      <div style={{width:40,height:40,border:'3px solid #1e2540',borderTopColor:'#6366f1',borderRadius:'50%',animation:'spin 1s linear infinite'}}/>
      <p style={{color:'#475569',fontSize:13}}>Loading MistakeVault...</p>
    </div>
  );

  return(
    <div style={{display:'flex',height:'100vh',background:'#0a0d14',overflow:'hidden'}}>
      {/* SIDEBAR */}
      <div style={{width:sidebarOpen?240:52,background:'#060912',borderRight:'1px solid #0d1120',display:'flex',flexDirection:'column',flexShrink:0,transition:'width .2s',overflow:'hidden'}}>
        <div style={{padding:'13px 10px',borderBottom:'1px solid #0d1120',display:'flex',alignItems:'center',gap:8,flexShrink:0}}>
          <button onClick={()=>setSidebarOpen(o=>!o)} style={{background:'none',border:'none',color:'#6366f1',fontSize:16,padding:'5px 7px',borderRadius:6,flexShrink:0}}>☰</button>
          {sidebarOpen&&<div><span style={{fontSize:13,fontWeight:800,color:'#818cf8',letterSpacing:.5}}>MistakeVault</span><span style={{fontSize:9,color:'#374151',display:'block'}}>GATE Prep Tracker</span></div>}
        </div>
        <div style={{flex:1,overflowY:'auto',padding:'6px 0'}}>
          {[{id:'dashboard',icon:'◈',label:'Dashboard'},{id:'all-m',icon:'⚡',label:'All Mistakes',bc:'#6366f1',badge:mistakes.length},{id:'all-p',icon:'📚',label:'All PYQs',bc:'#06b6d4',badge:pyqs.length}].map(({id,icon,label,bc,badge})=>(
            <button key={id} onClick={()=>nav(id,null,null,null)}
              style={{width:'100%',display:'flex',alignItems:'center',gap:9,padding:'9px 12px',background:view===id?'#6366f115':'none',border:'none',color:view===id?'#818cf8':'#475569',fontSize:12,textAlign:'left',cursor:'pointer',borderLeft:view===id?'2px solid #6366f1':'2px solid transparent'}}>
              <span style={{width:18,textAlign:'center',flexShrink:0}}>{icon}</span>
              {sidebarOpen&&<><span style={{flex:1}}>{label}</span>{badge>0&&<Badge count={badge} color={bc||'#6366f1'}/>}</>}
            </button>
          ))}
          {sidebarOpen&&<button onClick={()=>setShowBackup(true)} style={{width:'100%',display:'flex',alignItems:'center',gap:9,padding:'9px 12px',background:'none',border:'none',color:'#f59e0b',fontSize:12,textAlign:'left',cursor:'pointer',borderLeft:'2px solid transparent'}}>
            <span style={{width:18,textAlign:'center',flexShrink:0}}>💾</span>
            <span>Backup / Restore</span>
          </button>}
          {sidebarOpen&&<div style={{padding:'10px 12px 4px',fontSize:9,color:'#374151',fontWeight:700,letterSpacing:1,textTransform:'uppercase'}}>Subjects</div>}
          {subjects.map(s=>{
            const mCnt=mistakes.filter(q=>q.subject===s.id).length;
            const pCnt=pyqs.filter(q=>q.subject===s.id).length;
            const active=['subject','mode','chapter-m','chapter-p'].includes(view)&&selSub===s.id;
            return(
              <button key={s.id} onClick={()=>nav('subject',s.id,null,null)}
                style={{width:'100%',display:'flex',alignItems:'center',gap:9,padding:'8px 12px',background:active?s.color+'12':'none',border:'none',color:active?s.color:'#475569',fontSize:12,textAlign:'left',cursor:'pointer',borderLeft:active?`2px solid ${s.color}`:'2px solid transparent',transition:'background .15s'}}>
                <span style={{width:7,height:7,borderRadius:'50%',background:s.color,flexShrink:0,marginLeft:4}}/>
                {sidebarOpen&&<><span style={{flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{s.name}</span>
                <div style={{display:'flex',gap:3}}>{mCnt>0&&<Badge count={mCnt} color={s.color}/>}{pCnt>0&&<Badge count={pCnt} color="#06b6d4"/>}</div></>}
              </button>
            );
          })}
          {sidebarOpen&&<button onClick={()=>setShowAddSub(true)} style={{width:'100%',display:'flex',alignItems:'center',gap:9,padding:'8px 12px',background:'none',border:'none',color:'#374151',fontSize:12,textAlign:'left',cursor:'pointer',borderLeft:'2px solid transparent'}}>
            <span style={{marginLeft:4}}>+</span><span>Add Subject</span>
          </button>}
        </div>
      </div>

      {/* MAIN */}
      <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
        <div style={{padding:'10px 18px',borderBottom:'1px solid #0d1120',display:'flex',alignItems:'center',gap:10,background:'#060912',flexShrink:0}}>
          <div style={{flex:1,position:'relative'}}>
            <span style={{position:'absolute',left:11,top:'50%',transform:'translateY(-50%)',color:'#374151',fontSize:14,pointerEvents:'none'}}>⌕</span>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search questions, PYQs, tags..." style={{paddingLeft:32,fontSize:13}}/>
          </div>
          {!isSearch&&<>
            <button onClick={()=>setShowAddM(true)} style={{background:'linear-gradient(135deg,#6366f1,#8b5cf6)',border:'none',borderRadius:8,color:'#fff',padding:'7px 14px',fontSize:12,fontWeight:700,whiteSpace:'nowrap',flexShrink:0}}>+ Mistake</button>
            <button onClick={()=>setShowAddP(true)} style={{background:'linear-gradient(135deg,#06b6d4,#0ea5e9)',border:'none',borderRadius:8,color:'#fff',padding:'7px 14px',fontSize:12,fontWeight:700,whiteSpace:'nowrap',flexShrink:0}}>+ PYQ</button>
          </>}
          {isSearch&&<button onClick={()=>setSearch('')} style={{background:'#131929',border:'1px solid #1e2540',borderRadius:8,color:'#64748b',padding:'7px 12px',fontSize:12,flexShrink:0}}>✕ Clear</button>}
        </div>

        <div style={{flex:1,overflowY:'auto',padding:20}}>
          {isSearch&&<div>
            <h2 style={{fontSize:16,fontWeight:700,marginBottom:4}}>Search: "{search}"</h2>
            <p style={{fontSize:12,color:'#475569',marginBottom:16}}>{visM.length} mistakes · {visP.length} PYQs</p>
            {visM.length>0&&<><h3 style={{fontSize:11,fontWeight:700,color:'#6366f1',marginBottom:10,textTransform:'uppercase',letterSpacing:.5}}>Mistakes ({visM.length})</h3>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:10,marginBottom:20}}>{visM.map(q=><MistakeCard key={q.id} q={q} subjects={subjects} onClick={()=>setViewM(q)}/>)}</div></>}
            {visP.length>0&&<><h3 style={{fontSize:11,fontWeight:700,color:'#06b6d4',marginBottom:10,textTransform:'uppercase',letterSpacing:.5}}>PYQs ({visP.length})</h3>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:10}}>{visP.map(q=><PYQCard key={q.id} q={q} subjects={subjects} onClick={()=>setViewP(q)}/>)}</div></>}
            {visM.length===0&&visP.length===0&&<div style={{textAlign:'center',padding:60,color:'#374151'}}><p style={{fontSize:32,marginBottom:10}}>🔍</p><p>No results for "{search}"</p></div>}
          </div>}

          {!isSearch&&view==='dashboard'&&<Dashboard mistakes={mistakes} pyqs={pyqs} subjects={subjects} onBackup={()=>setShowBackup(true)}/>}

          {!isSearch&&view==='all-m'&&<div>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16,flexWrap:'wrap',gap:10}}>
              <div><h2 style={{fontSize:17,fontWeight:700}}>All Mistakes</h2><p style={{fontSize:12,color:'#475569',marginTop:2}}>{visM.length} questions</p></div>
              <div style={{display:'flex',gap:7,flexWrap:'wrap'}}>
                <select value={filterM.subject} onChange={e=>setFilterM(f=>({...f,subject:e.target.value}))} style={{width:'auto',fontSize:11,padding:'5px 8px'}}><option value="">All Subjects</option>{subjects.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}</select>
                <select value={filterM.mistakeType} onChange={e=>setFilterM(f=>({...f,mistakeType:e.target.value}))} style={{width:'auto',fontSize:11,padding:'5px 8px'}}><option value="">All Types</option>{MISTAKE_TYPES.map(m=><option key={m}>{m}</option>)}</select>
                <select value={filterM.difficulty} onChange={e=>setFilterM(f=>({...f,difficulty:e.target.value}))} style={{width:'auto',fontSize:11,padding:'5px 8px'}}><option value="">All Difficulty</option>{DIFFICULTIES.map(d=><option key={d}>{d}</option>)}</select>
                <select value={filterM.status} onChange={e=>setFilterM(f=>({...f,status:e.target.value}))} style={{width:'auto',fontSize:11,padding:'5px 8px'}}><option value="">All Status</option>{MISTAKE_STATUSES.map(s=><option key={s}>{s}</option>)}</select>
              </div>
            </div>
            {visM.length===0?<EmptyState type="mistake"/>:<div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:10}}>{visM.map(q=><MistakeCard key={q.id} q={q} subjects={subjects} onClick={()=>setViewM(q)}/>)}</div>}
          </div>}

          {!isSearch&&view==='all-p'&&<div>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16,flexWrap:'wrap',gap:10}}>
              <div><h2 style={{fontSize:17,fontWeight:700,color:'#22d3ee'}}>All PYQs</h2><p style={{fontSize:12,color:'#475569',marginTop:2}}>{visP.length} entries</p></div>
              <div style={{display:'flex',gap:7,flexWrap:'wrap'}}>
                <select value={filterP.subject} onChange={e=>setFilterP(f=>({...f,subject:e.target.value}))} style={{width:'auto',fontSize:11,padding:'5px 8px'}}><option value="">All Subjects</option>{subjects.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}</select>
                <input value={filterP.year} onChange={e=>setFilterP(f=>({...f,year:e.target.value}))} placeholder="Year/exam" style={{width:120,fontSize:11,padding:'5px 8px'}}/>
                <select value={filterP.status} onChange={e=>setFilterP(f=>({...f,status:e.target.value}))} style={{width:'auto',fontSize:11,padding:'5px 8px'}}><option value="">All Status</option>{PYQ_STATUSES.map(s=><option key={s}>{s}</option>)}</select>
                <button onClick={()=>setFilterP(f=>({...f,important:!f.important}))} style={{background:filterP.important?'#f59e0b22':'#131929',border:`1px solid ${filterP.important?'#f59e0b':'#1e2540'}`,borderRadius:7,color:filterP.important?'#f59e0b':'#64748b',padding:'5px 10px',fontSize:11}}>⭐</button>
                <button onClick={()=>setFilterP(f=>({...f,doubt:!f.doubt}))} style={{background:filterP.doubt?'#ef444422':'#131929',border:`1px solid ${filterP.doubt?'#ef4444':'#1e2540'}`,borderRadius:7,color:filterP.doubt?'#ef4444':'#64748b',padding:'5px 10px',fontSize:11}}>❓</button>
              </div>
            </div>
            {visP.length===0?<EmptyState type="pyq"/>:<div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:10}}>{visP.map(q=><PYQCard key={q.id} q={q} subjects={subjects} onClick={()=>setViewP(q)}/>)}</div>}
          </div>}

          {!isSearch&&view==='subject'&&sub&&<div>
            <div style={{marginBottom:24}}>
              <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:4}}><span style={{width:10,height:10,borderRadius:'50%',background:sub.color,display:'inline-block'}}/><h2 style={{fontSize:20,fontWeight:800,color:sub.color}}>{sub.name}</h2></div>
              <p style={{fontSize:12,color:'#475569'}}>{mistakes.filter(q=>q.subject===sub.id).length} mistakes · {pyqs.filter(q=>q.subject===sub.id).length} PYQs</p>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,maxWidth:640}}>
              {[{mode:'mistake',icon:'⚡',label:'Test Series Mistakes',color:'#818cf8',bg:'#0d0f1f',bc:'#6366f130',cnt:mistakes.filter(q=>q.subject===sub.id).length,desc:'Track wrong answers from mock tests. Upload screenshots, write explanations.'},
                {mode:'pyq',icon:'📚',label:'PYQ Tracker',color:'#22d3ee',bg:'#060f1a',bc:'#06b6d430',cnt:pyqs.filter(q=>q.subject===sub.id).length,desc:'Log previous year questions. Track year, solution location, notebook reference.'}
              ].map(({mode,icon,label,color,bg,bc,cnt,desc})=>(
                <div key={mode} onClick={()=>nav('mode',selSub,mode,null)}
                  style={{background:`linear-gradient(135deg,${bg},${bg}ee)`,border:`1px solid ${bc}`,borderRadius:14,padding:24,cursor:'pointer',transition:'transform .15s,border-color .2s'}}
                  onMouseEnter={e=>{e.currentTarget.style.transform='translateY(-3px)';e.currentTarget.style.borderColor=color}}
                  onMouseLeave={e=>{e.currentTarget.style.transform='none';e.currentTarget.style.borderColor=bc}}>
                  <div style={{fontSize:32,marginBottom:12}}>{icon}</div>
                  <h3 style={{fontSize:15,fontWeight:800,color,marginBottom:6}}>{label}</h3>
                  <p style={{fontSize:12,color:'#475569',marginBottom:14,lineHeight:1.5}}>{desc}</p>
                  <span style={{fontSize:22,fontWeight:800,color}}>{cnt}</span><span style={{fontSize:11,color:'#475569',marginLeft:6}}>saved</span>
                </div>
              ))}
            </div>
          </div>}

          {!isSearch&&view==='mode'&&sub&&<div>
            <button onClick={()=>nav('subject',selSub,null,null)} style={{background:'none',border:'none',color:'#475569',fontSize:12,cursor:'pointer',padding:0,marginBottom:16}}>← {sub.name}</button>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20,flexWrap:'wrap',gap:10}}>
              <div>
                <h2 style={{fontSize:17,fontWeight:800,color:selMode==='pyq'?'#22d3ee':'#818cf8'}}>{selMode==='pyq'?'📚 PYQ Tracker':'⚡ Test Series Mistakes'} — {sub.name}</h2>
                <p style={{fontSize:12,color:'#475569',marginTop:2}}>{sub.chapters.length} chapters</p>
              </div>
              <div style={{display:'flex',gap:8}}>
                <button onClick={()=>setShowAddCh(true)} style={{background:'#131929',border:'1px solid #1e2540',borderRadius:7,color:'#64748b',padding:'6px 12px',fontSize:12}}>+ Chapter</button>
                <button onClick={()=>setShowDelCh(true)} style={{background:'#131929',border:'1px solid #1e2540',borderRadius:7,color:'#64748b',padding:'6px 12px',fontSize:12}}>− Chapter</button>
              </div>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(180px,1fr))',gap:10}}>
              {sub.chapters.map(ch=>{
                const cnt=selMode==='pyq'?pyqs.filter(q=>q.subject===sub.id&&q.chapter===ch).length:mistakes.filter(q=>q.subject===sub.id&&q.chapter===ch).length;
                const accent=selMode==='pyq'?'#06b6d4':sub.color;
                return(
                  <div key={ch} onClick={()=>nav(selMode==='pyq'?'chapter-p':'chapter-m',selSub,selMode,ch)}
                    style={{background:selMode==='pyq'?'#060f1a':'#0d1120',border:`1px solid ${selMode==='pyq'?'#0e2040':'#1a1f35'}`,borderRadius:10,padding:14,cursor:'pointer',transition:'border-color .15s,transform .1s'}}
                    onMouseEnter={e=>{e.currentTarget.style.borderColor=accent;e.currentTarget.style.transform='translateY(-2px)'}}
                    onMouseLeave={e=>{e.currentTarget.style.borderColor=selMode==='pyq'?'#0e2040':'#1a1f35';e.currentTarget.style.transform='none'}}>
                    <p style={{fontSize:13,fontWeight:600,color:'#e2e8f0',marginBottom:10,lineHeight:1.3}}>{ch}</p>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                      <span style={{fontSize:11,color:'#475569'}}>{cnt} saved</span>
                      {cnt>0&&<span style={{fontSize:10,background:accent+'22',color:accent,padding:'1px 6px',borderRadius:5,fontWeight:700}}>{cnt}</span>}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>}

          {!isSearch&&view==='chapter-m'&&sub&&<div>
            <button onClick={()=>nav('mode',selSub,'mistake',null)} style={{background:'none',border:'none',color:'#475569',fontSize:12,cursor:'pointer',padding:0,marginBottom:6}}>← {sub.name} / Test Series</button>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16,flexWrap:'wrap',gap:10}}>
              <div><h2 style={{fontSize:17,fontWeight:700}}>{selChapter}</h2><p style={{fontSize:12,color:'#475569',marginTop:2}}>{visM.length} mistakes</p></div>
              <button onClick={()=>setShowAddM(true)} style={{background:'linear-gradient(135deg,#6366f1,#8b5cf6)',border:'none',borderRadius:8,color:'#fff',padding:'7px 14px',fontSize:12,fontWeight:700}}>+ Add Mistake</button>
            </div>
            {visM.length===0?<EmptyState type="mistake"/>:<div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:10}}>{visM.map(q=><MistakeCard key={q.id} q={q} subjects={subjects} onClick={()=>setViewM(q)}/>)}</div>}
          </div>}

          {!isSearch&&view==='chapter-p'&&sub&&<div>
            <button onClick={()=>nav('mode',selSub,'pyq',null)} style={{background:'none',border:'none',color:'#475569',fontSize:12,cursor:'pointer',padding:0,marginBottom:6}}>← {sub.name} / PYQ Tracker</button>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16,flexWrap:'wrap',gap:10}}>
              <div><h2 style={{fontSize:17,fontWeight:700,color:'#22d3ee'}}>{selChapter}</h2><p style={{fontSize:12,color:'#475569',marginTop:2}}>{visP.length} PYQs</p></div>
              <button onClick={()=>setShowAddP(true)} style={{background:'linear-gradient(135deg,#06b6d4,#0ea5e9)',border:'none',borderRadius:8,color:'#fff',padding:'7px 14px',fontSize:12,fontWeight:700}}>+ Add PYQ</button>
            </div>
            {visP.length===0?<EmptyState type="pyq"/>:<div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:10}}>{visP.map(q=><PYQCard key={q.id} q={q} subjects={subjects} onClick={()=>setViewP(q)}/>)}</div>}
          </div>}
        </div>
      </div>

      {/* MODALS */}
      {(showAddM||editM)&&<Modal title={editM?'Edit Mistake':'Add Mistake'} onClose={()=>{setShowAddM(false);setEditM(null)}} wide>
        <MistakeForm q={editM} subjects={subjects} defSub={selSub} defCh={view==='chapter-m'?selChapter:''} onSave={q=>{saveM(q);setEditM(null);setShowAddM(false)}} onClose={()=>{setShowAddM(false);setEditM(null)}}/>
      </Modal>}
      {(showAddP||editP)&&<Modal title={editP?'Edit PYQ':'Add PYQ'} onClose={()=>{setShowAddP(false);setEditP(null)}} wide>
        <PYQForm q={editP} subjects={subjects} defSub={selSub} defCh={view==='chapter-p'?selChapter:''} onSave={q=>{saveP(q);setEditP(null);setShowAddP(false)}} onClose={()=>{setShowAddP(false);setEditP(null)}}/>
      </Modal>}
      {viewM&&!editM&&<Modal title={viewM.title} onClose={()=>setViewM(null)} wide>
        <MistakeDetail q={viewM} subjects={subjects} onClose={()=>setViewM(null)} onEdit={q=>{setEditM(q);setViewM(null)}} onDelete={delM}/>
      </Modal>}
      {viewP&&!editP&&<Modal title={`${viewP.qNum}${viewP.year?' — '+viewP.year:''}`} onClose={()=>setViewP(null)} wide>
        <PYQDetail q={viewP} subjects={subjects} onClose={()=>setViewP(null)} onEdit={q=>{setEditP(q);setViewP(null)}} onDelete={delP}/>
      </Modal>}
      {showBackup&&<Modal title="💾 Backup & Restore" onClose={()=>setShowBackup(false)}>
        <BackupModal mistakes={mistakes} pyqs={pyqs} subjects={subjects} setSubjects={setSubjects} setMistakes={setMistakes} setPyqs={setPyqs} onClose={()=>setShowBackup(false)}/>
      </Modal>}
      {showAddSub&&<Modal title="Add Subject" onClose={()=>{setShowAddSub(false);setNewSubName('')}}>
        <input value={newSubName} onChange={e=>setNewSubName(e.target.value)} placeholder="e.g. Theory of Computation" onKeyDown={e=>e.key==='Enter'&&addSubject()} autoFocus/>
        <div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:12}}>
          <button onClick={()=>{setShowAddSub(false);setNewSubName('')}} style={{background:'none',border:'1px solid #1e2540',borderRadius:7,color:'#64748b',padding:'7px 14px',fontSize:13}}>Cancel</button>
          <button onClick={addSubject} style={{background:'linear-gradient(135deg,#6366f1,#8b5cf6)',border:'none',borderRadius:7,color:'#fff',padding:'7px 14px',fontSize:13,fontWeight:700}}>Add</button>
        </div>
      </Modal>}
      {showAddCh&&sub&&<Modal title={`Add Chapter to ${sub.name}`} onClose={()=>{setShowAddCh(false);setNewChName('')}}>
        <input value={newChName} onChange={e=>setNewChName(e.target.value)} placeholder="Chapter name" onKeyDown={e=>e.key==='Enter'&&addChapter()} autoFocus/>
        <div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:12}}>
          <button onClick={()=>{setShowAddCh(false);setNewChName('')}} style={{background:'none',border:'1px solid #1e2540',borderRadius:7,color:'#64748b',padding:'7px 14px',fontSize:13}}>Cancel</button>
          <button onClick={addChapter} style={{background:'linear-gradient(135deg,#6366f1,#8b5cf6)',border:'none',borderRadius:7,color:'#fff',padding:'7px 14px',fontSize:13,fontWeight:700}}>Add</button>
        </div>
      </Modal>}
      {showDelCh&&sub&&<Modal title={`Delete Chapter from ${sub.name}`} onClose={()=>setShowDelCh(false)}>
        <p style={{fontSize:12,color:'#64748b',marginBottom:12}}>Questions won't be deleted, just lose chapter assignment.</p>
        <div style={{display:'flex',flexDirection:'column',gap:6,maxHeight:300,overflowY:'auto'}}>
          {sub.chapters.map(ch=>(
            <div key={ch} style={{display:'flex',justifyContent:'space-between',alignItems:'center',background:'#131929',borderRadius:8,padding:'9px 14px'}}>
              <span style={{fontSize:13,color:'#e2e8f0'}}>{ch}</span>
              <button onClick={()=>{delChapter(ch);setShowDelCh(false)}} style={{background:'#ef444415',border:'1px solid #ef444440',borderRadius:6,color:'#ef4444',padding:'4px 10px',fontSize:11}}>Delete</button>
            </div>
          ))}
        </div>
        <div style={{display:'flex',justifyContent:'flex-end',marginTop:12}}>
          <button onClick={()=>setShowDelCh(false)} style={{background:'none',border:'1px solid #1e2540',borderRadius:7,color:'#64748b',padding:'7px 14px',fontSize:13}}>Cancel</button>
        </div>
      </Modal>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
